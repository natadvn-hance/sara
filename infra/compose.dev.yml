name: sara-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sara
      POSTGRES_PASSWORD: sara
      POSTGRES_DB: sara
    ports:
      - "54329:5432"
    volumes:
      - pg-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sara"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pg-dev:
