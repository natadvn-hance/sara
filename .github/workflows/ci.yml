name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The whole suite once a night (03:00 MSK) and by hand; pushes and PRs run only the tests their changes touch
  # (Boris, 28.10.2026: the Mac could not keep up with two full runs at once).
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR or branch replaces the run still going: only the latest code needs checking.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job runs on Boris's Mac (self-hosted runners «sara-mac» and «sara-mac-2», label sara-mac, 25.10.2026): the
# account's free Actions minutes ran out, and the repository is private, so only our own branches reach the runners.
jobs:
  # Docs and Markdown alone need no tests: «code» says whether anything else changed.
  changes:
    runs-on: [self-hosted, sara-mac]
    outputs:
      code: ${{ steps.diff.outputs.code }}
      web: ${{ steps.diff.outputs.web }}
      base: ${{ steps.diff.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No base (the nightly run, a first push): everything, the whole suite.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            { echo "code=true"; echo "web=true"; echo "base="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          files=$(git diff --name-only "$BASE" HEAD)
          if echo "$files" | grep -qvE '^docs/|\.md$'; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"
          # The pult e2e only when the pult or what it shares changed.
          if echo "$files" | grep -qE '^apps/web/|^packages/shared/|^pnpm-lock'; then echo "web=true"; else echo "web=false"; fi >> "$GITHUB_OUTPUT"

  # Lint, types, ports, commit messages and traceability in one checkout: on one runner, fewer jobs finish sooner.
  check:
    runs-on: [self-hosted, sara-mac]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Each runner keeps its own pnpm and package store: two jobs at once in one store break each other's writes.
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        env:
          npm_config_store_dir: ${{ runner.tool_cache }}/pnpm-store
      - run: pnpm check
      - run: pnpm check:ports
      # The voice service's worker life (ADR-028), stdlib only: no model, no torch.
      - run: python3 -I -m unittest discover -s infra/voice -p 'test_*.py'
      - if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: pnpm trace ${{ startsWith(github.head_ref, 'release-please--') && '--strict' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: traceability
          path: reports/traceability.md
          retention-days: 7

  secrets:
    runs-on: [self-hosted, sara-mac]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action downloads itself to a fixed file in TMPDIR: the runner's own temp folder, emptied after each
      # job, keeps it apart from the other runner and from the last run.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMPDIR: ${{ runner.temp }}

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, sara-mac]
    # A full run takes about 10 minutes; a job stuck past this (the Mac asleep) frees the runner for the rest.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Each runner keeps its own pnpm and package store: two jobs at once in one store break each other's writes.
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        env:
          npm_config_store_dir: ${{ runner.tool_cache }}/pnpm-store
      # A macOS runner has no service containers: the job starts its own Postgres and removes it at the end, with its
      # data volume (-v), or each run leaves one behind and the Mac disk fills up.
      # Each runner on the Mac has its own container and port, apart from each other and the dev sessions.
      - name: Start Postgres
        run: |
          case "$RUNNER_NAME" in sara-mac-2) port=54530 ;; *) port=54529 ;; esac
          name="sara-ci-pg-$RUNNER_NAME"
          echo "CI_PG=$name" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://sara:sara@localhost:$port/sara" >> "$GITHUB_ENV"
          docker rm -fv "$name" >/dev/null 2>&1 || true
          docker run -d --name "$name" -e POSTGRES_USER=sara -e POSTGRES_PASSWORD=sara -e POSTGRES_DB=sara \
            -p "$port:5432" pgvector/pgvector:pg16
          for i in $(seq 1 30); do docker exec "$name" pg_isready -U sara >/dev/null 2>&1 && exit 0; sleep 2; done
          exit 1
      # The pult e2e starts six servers. Each runner has its own block of ports (the base and five after it), apart from
      # the other runner, from a dev session's default (28120) and from the Mac's other projects (3000, 3100, 5173 ...).
      - name: Pick e2e ports
        run: |
          case "$RUNNER_NAME" in sara-mac-2) base=28110 ;; *) base=28100 ;; esac
          echo "E2E_PORT_BASE=$base" >> "$GITHUB_ENV"
      # Chromium first: the Profi-MCP tests drive a real browser too.
      - run: pnpm --filter @sara/web exec playwright install chromium
      # caffeinate keeps the Mac from idle sleep while the tests run (a closed lid still stops it).
      # A PR or a push runs the tests its changed files reach (vitest --changed); the nightly run, all of them.
      - run: caffeinate -i pnpm test ${{ needs.changes.outputs.base && format('--changed {0}', needs.changes.outputs.base) || '' }}
      # The pult e2e takes its ports from E2E_PORT_BASE (above), so another project's server on the Mac or the other
      # runner cannot collide with it, and a port that is taken stops the run at once with its name («порт N занят»).
      # The lock stays only so the two runners do not run two browser suites at once (the Mac could not keep up).
      - if: needs.changes.outputs.web == 'true'
        run: lockf -t 1800 /tmp/sara-ci-web-e2e.lock caffeinate -i pnpm --filter @sara/web e2e
      - run: pnpm --filter @sara/web build
      - name: Stop Postgres
        if: always()
        run: docker rm -fv "${CI_PG:-sara-ci-pg-$RUNNER_NAME}" >/dev/null 2>&1 || true
