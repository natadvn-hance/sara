name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR or branch replaces the run still going: only the latest code needs checking.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job runs on Boris's Mac (self-hosted runner «sara-mac», 25.10.2026): the account's free Actions minutes ran
# out, and the repository is private, so only our own branches reach the runner.
jobs:
  # Docs and Markdown alone need no tests: «code» says whether anything else changed.
  changes:
    runs-on: [self-hosted, sara-mac]
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Lint, types, ports, commit messages and traceability in one checkout: on one runner, fewer jobs finish sooner.
  check:
    runs-on: [self-hosted, sara-mac]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:ports
      - if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: pnpm trace ${{ startsWith(github.head_ref, 'release-please--') && '--strict' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: traceability
          path: reports/traceability.md
          retention-days: 7

  secrets:
    runs-on: [self-hosted, sara-mac]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action downloads itself to a fixed temp file that a persistent runner keeps from the last run.
      - run: rm -f "${TMPDIR:-/tmp}/gitleaks.tmp"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, sara-mac]
    # A full run takes about 10 minutes; a job stuck past this (the Mac asleep) frees the runner for the rest.
    timeout-minutes: 40
    env:
      # Its own port and container: the Mac runs other Postgres containers for the dev sessions.
      DATABASE_URL: postgres://sara:sara@localhost:54529/sara
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # A macOS runner has no service containers: the job starts its own Postgres and removes it at the end.
      - name: Start Postgres
        run: |
          docker rm -f sara-ci-pg >/dev/null 2>&1 || true
          docker run -d --name sara-ci-pg -e POSTGRES_USER=sara -e POSTGRES_PASSWORD=sara -e POSTGRES_DB=sara \
            -p 54529:5432 pgvector/pgvector:pg16
          for i in $(seq 1 30); do docker exec sara-ci-pg pg_isready -U sara >/dev/null 2>&1 && exit 0; sleep 2; done
          exit 1
      # Chromium first: the Profi-MCP tests drive a real browser too.
      - run: pnpm --filter @sara/web exec playwright install chromium
      # caffeinate keeps the Mac from idle sleep while the tests run (a closed lid still stops it).
      - run: caffeinate -i pnpm test
      # The pult e2e uses fixed ports; a dev session running it at the same moment takes them, so one more try.
      - run: caffeinate -i pnpm --filter @sara/web e2e || (sleep 60 && caffeinate -i pnpm --filter @sara/web e2e)
      - run: pnpm --filter @sara/web build
      - name: Stop Postgres
        if: always()
        run: docker rm -f sara-ci-pg >/dev/null 2>&1 || true
