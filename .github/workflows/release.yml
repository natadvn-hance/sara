name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Boris's Mac, like CI: the account's free Actions minutes ran out (25.10.2026).
    runs-on: [self-hosted, sara-mac]
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
